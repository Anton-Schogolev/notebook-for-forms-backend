name: notebook-for-forms-auth-tests

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: notebook_auth_test
      POSTGRES_USER: notebook_auth_test
      POSTGRES_PASSWORD: notebook_auth_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "notebook_auth_test", "-d", "notebook_auth_test"]
      interval: 2s
      timeout: 3s
      retries: 15
